<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<title>All-Sides SC – Staff Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0e1a;--bg-elev:#0f1420;--bg-elev-2:#1a1f2e;--border:#1e2438;--border-strong:#2d3348;--text:#f0f4ff;--text-mute:#94a3b8;--text-dim:#64748b;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--yellow:#f59e0b}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg-elev)}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}
input,select,textarea{font-family:'DM Sans',sans-serif;font-size:14px}
input[type=date]::-webkit-calendar-picker-indicator,input[type=month]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1);opacity:0.4;cursor:pointer}
table{width:100%;border-collapse:collapse}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none}
#app{display:flex;flex-direction:column;min-height:100vh}
#header{background:var(--bg-elev);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:14px;height:60px;position:sticky;top:0;z-index:100;flex-shrink:0}
#body{display:flex;flex:1}
#sidebar{width:200px;background:#0d1120;border-right:1px solid var(--border);padding:14px 10px;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column}
#main{flex:1;padding:24px;overflow-y:auto;min-width:0}
#menu-toggle{display:none;background:transparent;border:none;color:var(--text-mute);font-size:24px;padding:4px 8px}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:90}
#logo{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
#logo-img{width:38px;height:38px;border-radius:8px;background:#fff;padding:2px;flex-shrink:0;object-fit:contain}
#logo-text{font-size:14px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#logo-sub{font-size:10px;color:var(--text-dim);letter-spacing:0.5px}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:10px 12px;color:var(--text-dim);font-size:13px;font-weight:600;margin-bottom:4px;text-align:left;transition:all 0.15s}
.nav-btn:hover{color:var(--text-mute);background:#ffffff08}
.nav-btn.active{background:#22c55e22;border-color:#22c55e55;color:#4ade80}
.nav-divider{border-top:1px solid var(--border);margin:14px 0 10px}
.nav-sub-label{font-size:10px;color:var(--text-dim);letter-spacing:0.5px;padding:0 4px;margin-bottom:8px;text-transform:uppercase}
.nav-export-btn{display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 12px;color:var(--text-dim);font-size:12px;font-weight:600;margin-bottom:4px;text-align:left}
.nav-export-btn:hover{color:var(--text-mute);background:#ffffff08}
.btn{border-radius:8px;padding:9px 18px;font-size:13px;font-weight:700;transition:opacity 0.15s,transform 0.1s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{opacity:0.88}.btn:active{transform:scale(0.97)}.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,#1d6f3e,#2d9e5a);color:#fff}
.btn-ghost{background:transparent;color:var(--text-mute);border:1px solid var(--border-strong)}
.btn-danger{background:#ef444422;color:var(--red);border:1px solid #ef444444}
.btn-warning{background:#f59e0b22;color:var(--yellow);border:1px solid #f59e0b44}
.btn-sm{padding:6px 12px;font-size:12px}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:0.3px;white-space:nowrap}
.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-card{background:var(--bg-elev);border-radius:14px;padding:18px;cursor:pointer;transition:transform 0.15s;flex:1;min-width:140px}
.stat-card:hover{transform:translateY(-2px)}
.field{margin-bottom:14px}
.field label{display:block;color:var(--text-mute);font-size:12px;font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:10px 12px;outline:none;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1d6f3e}
.tbl-wrap{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl-wrap table th{padding:12px 14px;font-size:11px;color:var(--text-dim);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
.tbl-wrap table td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px}
.tbl-wrap table tr:last-child td{border-bottom:none}
.tbl-empty{padding:36px;text-align:center;color:var(--text-dim);font-size:14px}
#modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:500;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px)}
#modal-overlay.open{display:flex}
#modal-box{background:var(--bg-elev-2);border:1px solid var(--border-strong);border-radius:16px 16px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:24px}
#modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
#modal-title{font-size:17px;font-weight:700}
#modal-close{background:none;color:var(--text-mute);font-size:26px;line-height:1;padding:0 4px}
@media(min-width:600px){#modal-overlay{align-items:center;padding:16px}#modal-box{border-radius:16px}}
.alert{border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:14px;line-height:1.5}
.alert-warning{background:#f59e0b11;border:1px solid #f59e0b33;color:var(--yellow)}
.alert-danger{background:#ef444422;border:1px solid #ef444444;color:#f87171}
.alert-info{background:#3b82f611;border:1px solid #3b82f633;color:#60a5fa}
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.staff-avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0}
.disc-card,.review-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:12px}
.filter-pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{background:transparent;border:1px solid var(--border-strong);border-radius:8px;color:var(--text-mute);padding:7px 16px;font-size:13px;font-weight:600;transition:all 0.15s}
.pill.active{background:#22c55e22;border-color:var(--green);color:#4ade80}
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-input,.filter-select{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);padding:9px 14px;font-size:13px;outline:none}
.search-input{flex:1;min-width:180px}
.search-input:focus,.filter-select:focus{border-color:#1d6f3e}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.section-title{font-size:22px;font-weight:800}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.dash-panel-title{font-weight:700;margin-bottom:14px;font-size:13px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px}
.dash-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);gap:10px}
.dash-row:last-child{border-bottom:none}
.notes-block{font-size:13px;color:var(--text-mute);background:#ffffff08;border-radius:8px;padding:8px 12px;margin-top:8px;word-break:break-word}
.star-btn{background:var(--bg-elev);border:1px solid var(--border-strong);border-radius:8px;color:var(--text-dim);width:40px;height:40px;font-size:18px;transition:all 0.1s}
.star-btn.active{background:#1d6f3e;color:#fff;border-color:#1d6f3e}
#header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
#user-chip{background:var(--bg);border:1px solid var(--border-strong);border-radius:20px;padding:6px 8px 6px 12px;font-size:12px;color:var(--text-mute);font-weight:600;display:flex;align-items:center;gap:8px}
#user-chip .role-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
#login-screen{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 20% 30%,#ef444415 0%,transparent 50%),radial-gradient(circle at 80% 70%,#3b82f615 0%,transparent 50%),radial-gradient(circle at 50% 90%,#22c55e10 0%,transparent 50%),radial-gradient(circle at 90% 20%,#f59e0b10 0%,transparent 50%),var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
#login-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:20px;padding:32px;max-width:380px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.5)}
#login-logo{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:24px}
#login-logo img{width:90px;height:90px;border-radius:12px;background:#fff;padding:4px;margin-bottom:14px}
#login-title{font-size:22px;font-weight:800;margin-bottom:4px}
#login-subtitle{font-size:12px;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase}
.login-color-bar{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 25%,var(--green) 25%,var(--green) 50%,var(--yellow) 50%,var(--yellow) 75%,var(--blue) 75%,var(--blue) 100%);margin:0 0 24px}
#login-error{display:none;background:#ef444422;border:1px solid #ef444444;color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:14px}
#login-error.show{display:block}
.user-row{background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
#brand-strip{height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 25%,var(--green) 25%,var(--green) 50%,var(--yellow) 50%,var(--yellow) 75%,var(--blue) 75%,var(--blue) 100%)}
#splash{position:fixed;inset:0;z-index:2000;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#splash img{width:80px;height:80px;border-radius:14px;background:#fff;padding:4px;animation:pulse 1.4s ease-in-out infinite}
#splash-text{color:var(--text-dim);font-size:13px;letter-spacing:1px;text-transform:uppercase}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.7;transform:scale(0.96)}}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--bg-elev-2);border:1px solid var(--border-strong);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;z-index:3000;transition:transform 0.3s;box-shadow:0 10px 30px rgba(0,0,0,0.4);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast.success{border-color:#22c55e55;color:#4ade80}
#toast.error{border-color:#ef444455;color:#f87171}
#config-banner{background:#f59e0b22;border-bottom:1px solid #f59e0b44;color:var(--yellow);padding:14px 20px;font-size:13px;text-align:center;font-weight:600;display:none}
#config-banner.show{display:block}
@media(max-width:850px){
  #menu-toggle{display:block}
  #sidebar{position:fixed;top:63px;bottom:0;left:0;width:240px;transform:translateX(-100%);transition:transform 0.25s;z-index:95}
  #sidebar.open{transform:translateX(0)}
  #sidebar-overlay.open{display:block}
  #main{padding:16px;width:100%}
  .section-title{font-size:19px}
  #user-chip{font-size:11px;padding:5px 10px}
  #user-chip .user-name{display:none}
  .staff-grid{grid-template-columns:1fr}
  .dash-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  #header{padding:0 12px;gap:8px}
  #logo-img{width:32px;height:32px}
  #logo-text{font-size:13px}
  #logo-sub{display:none}
  #main{padding:14px}
}
</style>
</head>
<body>

<div id="splash">
  <img id="splash-img" alt=""/>
  <div id="splash-text">Loading…</div>
</div>

<div id="config-banner">
  🔶 LOCAL MODE — running on this browser only. Data is saved here but won't sync to other devices. Set up Firebase (see the guide) to enable multi-user cloud sync.
</div>

<div id="login-screen" style="display:none">
  <div id="login-card">
    <div id="login-logo">
      <img id="login-logo-img" alt="Logo"/>
      <div id="login-title">All-Sides Sports Club</div>
      <div id="login-subtitle">Staff Management Portal</div>
    </div>
    <div class="login-color-bar"></div>
    <div id="login-error"></div>
    <div class="field"><label>Email</label><input id="login-email" type="email" autocomplete="email"/></div>
    <div class="field"><label>Password</label><input id="login-pass" type="password" autocomplete="current-password"/></div>
    <button id="login-btn" class="btn btn-primary" style="width:100%;padding:12px" onclick="doLogin()">Sign In</button>
    <div style="text-align:center;margin-top:18px;font-size:12px;color:var(--text-dim)">
      Forgot your password? <a href="#" onclick="forgotPassword();return false" style="color:#4ade80;text-decoration:none">Reset it</a>
    </div>
  </div>
</div>

<div id="app" style="display:none">
  <div id="header">
    <button id="menu-toggle" onclick="toggleSidebar()">☰</button>
    <div id="logo">
      <img id="logo-img" alt="Logo"/>
      <div style="min-width:0">
        <div id="logo-text">All-Sides SC</div>
        <div id="logo-sub">STAFF MANAGEMENT</div>
      </div>
    </div>
    <div id="header-actions">
      <div id="user-chip"><span class="role-dot"></span><span class="user-name" id="user-chip-name"></span><button class="btn btn-ghost btn-sm" onclick="logout()" style="padding:3px 8px;font-size:11px">Exit</button></div>
    </div>
  </div>
  <div id="brand-strip"></div>
  <div id="body">
    <div id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div id="sidebar">
      <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard',this)">📊 Dashboard</button>
      <button class="nav-btn" data-tab="staff" onclick="switchTab('staff',this)">👤 Staff</button>
      <button class="nav-btn" data-tab="attendance" onclick="switchTab('attendance',this)">📋 Attendance</button>
      <button class="nav-btn" data-tab="disciplinary" onclick="switchTab('disciplinary',this)">⚠️ Disciplinary</button>
      <button class="nav-btn" data-tab="pay" onclick="switchTab('pay',this)">💷 Pay</button>
      <button class="nav-btn" data-tab="qualifications" onclick="switchTab('qualifications',this)">🎓 Qualifications</button>
      <button class="nav-btn" data-tab="performance" onclick="switchTab('performance',this)">📈 Performance</button>
      <button class="nav-btn" data-tab="incidents" onclick="switchTab('incidents',this)">🚨 Incidents</button>
      <button class="nav-btn" data-tab="dbs" onclick="switchTab('dbs',this)">🛡️ DBS Tracker</button>
      <button class="nav-btn" data-tab="kit" onclick="switchTab('kit',this)">⚽ Kit & Equipment</button>
      <button class="nav-btn" data-tab="sponsors" onclick="switchTab('sponsors',this)">🤝 Sponsors</button>
      <button class="nav-btn" data-tab="grants" onclick="switchTab('grants',this)">💰 Grants & Funding</button>
      <button class="nav-btn" data-tab="summary" onclick="switchTab('summary',this)">📋 Weekly Summary</button>
      <button class="nav-btn admin-only" data-tab="users" onclick="switchTab('users',this)" style="display:none">🔐 Admin Users</button>
      <div class="nav-divider"></div>
      <div class="nav-sub-label">Data</div>
      <button class="nav-export-btn" onclick="exportBackup()">⬇ Backup All</button>
      <button class="nav-export-btn" onclick="exportPayCSV()">📥 Pay CSV</button>
      <button class="nav-export-btn" onclick="exportAttendanceCSV()">📥 Attendance CSV</button>
    </div>
    <div id="main"></div>
  </div>
</div>

<!-- ━━━ CONFIRM MODAL ━━━ -->
<div id="confirm-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:600;align-items:center;justify-content:center;padding:24px;backdrop-filter:blur(4px)">
  <div style="background:#1a1f2e;border:1px solid #2d3348;border-radius:16px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
    <div style="font-size:22px;margin-bottom:12px;text-align:center">⚠️</div>
    <div id="confirm-msg" style="font-size:14px;color:#f0f4ff;text-align:center;margin-bottom:20px;line-height:1.5"></div>
    <div style="display:flex;gap:10px">
      <button id="confirm-no" class="btn btn-ghost" style="flex:1" onclick="resolveConfirm(false)">Cancel</button>
      <button id="confirm-yes" class="btn btn-danger" style="flex:1" onclick="resolveConfirm(true)">Remove</button>
    </div>
  </div>
</div>

<div id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div id="modal-box">
    <div id="modal-header"><div id="modal-title"></div><button id="modal-close" onclick="closeModal()">×</button></div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

// ━━━ CUSTOM ALERT (replaces browser alert() which is blocked in some contexts) ━━━
function appAlert(msg) {
  return new Promise(function(resolve) {
    __confirmResolve = resolve;
    document.getElementById("confirm-msg").textContent = msg;
    document.getElementById("confirm-yes").textContent = "OK";
    document.getElementById("confirm-no").style.display = "none";
    document.getElementById("confirm-overlay").style.display = "flex";
  });
}
// Re-show cancel after use
var __origResolve = null;
function resolveAlert() {
  document.getElementById("confirm-no").style.display = "";
  resolveConfirm(true);
}

// ━━━ CUSTOM CONFIRM (replaces browser confirm() which is blocked in some contexts) ━━━
var __confirmResolve = null;
function appConfirm(msg, yesLabel) {
  yesLabel = yesLabel || "Remove";
  return new Promise(function(resolve) {
    __confirmResolve = resolve;
    document.getElementById("confirm-msg").textContent = msg;
    document.getElementById("confirm-yes").textContent = yesLabel;
    document.getElementById("confirm-overlay").style.display = "flex";
  });
}
function resolveConfirm(result) {
  document.getElementById("confirm-overlay").style.display = "none";
  if (__confirmResolve) { __confirmResolve(result); __confirmResolve = null; }
}
window.resolveConfirm = resolveConfirm;

function handleFirebaseMissing() {
  document.getElementById("splash").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  showLoginError("Firebase is not configured. Follow the setup guide to enable login.");
}

function handleFirebaseReady() {
  firebaseReady = true;
  window.fb.onAuthStateChanged(window.fbAuth, async function(user) {
    if (user) {
      try {
        var snap = await window.fb.getDoc(window.fb.doc(window.fbDb, "users", user.uid));
        if (!snap.exists()) {
          await window.fb.signOut(window.fbAuth);
          document.getElementById("splash").style.display = "none";
          document.getElementById("login-screen").style.display = "flex";
          showLoginError("Account not found. Contact the system owner.");
          return;
        }
        var profile = snap.data();
        currentUser = { uid: user.uid, email: user.email, name: profile.name, role: profile.role };
        showApp();
      } catch (err) {
        console.error("Profile load error:", err);
        document.getElementById("splash").style.display = "none";
        document.getElementById("login-screen").style.display = "flex";
        showLoginError("Could not load profile. Check your internet and refresh.");
      }
    } else {
      document.getElementById("splash").style.display = "none";
      document.getElementById("login-screen").style.display = "flex";
    }
  });
}

// ═══ MODE RESOLUTION ═══
// The app runs in one of two modes:
//   "cloud" — Firebase configured: real-time sync across devices
//   "local" — Firebase not configured: works immediately using this browser's storage
var LOCAL_MODE = false;
var modeResolved = false;
function markResolved() { modeResolved = true; }

window.addEventListener("firebaseReady", function() { markResolved(); handleFirebaseReady(); });
window.addEventListener("firebaseLocal", function() { markResolved(); startLocalMode(); });

// Handle the case where the module already finished before this script ran
if (window.__firebaseStatus === "ready") {
  modeResolved = true;
  handleFirebaseReady();
} else if (window.__firebaseStatus === "local") {
  modeResolved = true;
  startLocalMode();
}

// Safety net: if the Firebase module never loads (offline / CDN blocked / opened via file://),
// fall back to local mode after 6 seconds so the app is never stuck on the splash.
setTimeout(function() {
  if (!modeResolved) {
    document.getElementById("config-banner").classList.add("show");
    startLocalMode();
  }
}, 6000);

  try { localStorage.setItem("assc_" + key, JSON.stringify(val)); } catch (e) {}

function showLoginError(msg) {
  var err = document.getElementById("login-error");
  err.textContent = msg;
  err.classList.add("show");
}

async function doLogin() {
  if (!firebaseReady) { showLoginError("Firebase not configured."); return; }
  var email = document.getElementById("login-email").value.trim();
  var pass = document.getElementById("login-pass").value;
  var btn = document.getElementById("login-btn");
  if (!email || !pass) { showLoginError("Enter email and password."); return; }
  document.getElementById("login-error").classList.remove("show");
  btn.disabled = true;
  btn.textContent = "Signing in…";
  try {
    await window.fb.signInWithEmailAndPassword(window.fbAuth, email, pass);
    document.getElementById("login-pass").value = "";
  } catch (e) {
    var msg = "Invalid email or password.";
    if (e.code === "auth/too-many-requests") msg = "Too many failed attempts. Try again later or reset your password.";
    if (e.code === "auth/network-request-failed") msg = "Network error. Check your internet connection.";
    if (e.code === "auth/invalid-email") msg = "Invalid email format.";
    showLoginError(msg);
    btn.disabled = false;
    btn.textContent = "Sign In";
  }
}
window.doLogin = doLogin;

async function forgotPassword() {
  var email = document.getElementById("login-email").value.trim();
  if (!email) { showLoginError("Enter your email above first, then click 'Reset it'."); return; }
  try {
    await window.fb.sendPasswordResetEmail(window.fbAuth, email);
    toast("Password reset email sent. Check your inbox.", "success");
  } catch (e) {
    showLoginError("Could not send reset email. Check the address is correct.");
  }
}

async function logout() {

  DB = { staff: [], shifts: [], disc: [], reviews: [], users: [], incidents: [], kit: [], sponsors: [], grants: [] };

  });

function subscribeToData() {
  unsubscribes.forEach(function(u) { try { u(); } catch(e) {} });
  unsubscribes = [];
  ["staff", "shifts", "disc", "reviews", "incidents", "kit", "sponsors", "grants"].forEach(function(col) {
    var unsub = window.fb.onSnapshot(
      window.fb.collection(window.fbDb, col),
      function(snap) {
        var docs = [];
        snap.forEach(function(d) { docs.push(Object.assign({ id: d.id }, d.data())); });
        DB[col] = docs;
        renderTab();
      },
      function(err) { console.error("Listen error for " + col + ":", err); toast("Connection issue: " + col, "error"); }
    );
    unsubscribes.push(unsub);
  });
  if (currentUser.role === "owner") {
    var usersUnsub = window.fb.onSnapshot(
      window.fb.collection(window.fbDb, "users"),
      function(snap) {
        var docs = [];
        snap.forEach(function(d) { docs.push(Object.assign({ id: d.id }, d.data())); });
        DB.users = docs;
        if (currentTab === "users") renderTab();
      }
    );
    unsubscribes.push(usersUnsub);
  }
}

var ROLES = ["Coach", "Head Coach", "Regional Manager", "Relations Manager", "Admin", "Volunteer"];
var REGIONS = ["East-Side", "North-Side", "West-Side", "South-Side", "Club-Wide"];
var DISC_TYPES = ["Late Arrival", "Absence – No Show", "Absence – Notified", "Misconduct", "Poor Performance", "Other"];
var DISC_LEVELS = ["Informal Chat", "Verbal Warning", "Written Warning", "Final Warning", "Suspension", "Dismissal"];
var SHIFT_STATUSES = ["Present", "Late", "Absent – Notified", "No Show"];
var REGION_COLORS = { "East-Side": "#ef4444", "North-Side": "#22c55e", "West-Side": "#3b82f6", "South-Side": "#f59e0b", "Club-Wide": "#8b5cf6" };
var SHIFT_COLORS = { "Present": "#22c55e", "Late": "#f59e0b", "Absent – Notified": "#3b82f6", "No Show": "#ef4444" };
var DISC_COLORS = { "Informal Chat": "#64748b", "Verbal Warning": "#f59e0b", "Written Warning": "#f97316", "Final Warning": "#ef4444", "Suspension": "#7c3aed", "Dismissal": "#991b1b" };
var QUAL_COLORS = { ok: "#22c55e", warning: "#f59e0b", expired: "#ef4444" };
var QUAL_LABELS = { ok: "Valid", warning: "Expiring Soon", expired: "Expired" };

function daysUntil(d) { return Math.ceil((new Date(d) - new Date()) / 86400000); }
function qualStatus(e) { var d = daysUntil(e); return d < 0 ? "expired" : d <= 60 ? "warning" : "ok"; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—"; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function staffName(id) { var s = DB.staff.find(function(x) { return x.id === id; }); return s ? s.name : "Unknown"; }
function initials(n) { return n.split(" ").map(function(w) { return w[0]; }).join("").slice(0, 2).toUpperCase(); }
function badge(label, color) { return '<span class="badge" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44">' + esc(label) + '</span>'; }
function shiftBadge(s) { return badge(s, SHIFT_COLORS[s] || "#888"); }
function discBadge(l) { return badge(l, DISC_COLORS[l] || "#888"); }
function sortByName(arr) { return arr.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||""); }); }

async function saveDoc(col, id, data) {
  if (LOCAL_MODE) {
    // Update in-memory array, then persist to localStorage
    var arr = DB[col] || [];
    var idx = arr.findIndex(function(x) { return x.id === id; });
    var record = Object.assign({ id: id }, data);
    if (idx >= 0) arr[idx] = record; else arr.push(record);
    DB[col] = arr;
    lsSet(col, arr);
    renderTab();
    return true;
  }
  try { await window.fb.setDoc(window.fb.doc(window.fbDb, col, id), data); return true; }
  catch (e) { console.error("Save error:", e); toast("Could not save: " + (e.message || "error"), "error"); return false; }
}
async function deleteDocById(col, id) {
  if (LOCAL_MODE) {
    DB[col] = (DB[col] || []).filter(function(x) { return x.id !== id; });
    lsSet(col, DB[col]);
    renderTab();
    return true;
  }
  try { await window.fb.deleteDoc(window.fb.doc(window.fbDb, col, id)); return true; }
  catch (e) { console.error("Delete error:", e); toast("Could not delete: " + (e.message || "error"), "error"); return false; }
}

function switchTab(tab, el) {

  if (el) el.classList.add("active");
  else { var m = document.querySelector('[data-tab="' + tab + '"]'); if (m) m.classList.add("active"); }
  if (window.innerWidth <= 850) toggleSidebar(true);
  renderTab();
}

function toggleSidebar(forceClose) {

    case "grants": main.innerHTML = renderGrants(); break;
    case "summary": main.innerHTML = renderSummary(); break;

  }
}

    return '<tr><td style="font-weight:600;white-space:nowrap">' + esc(staffName(sh.staffId)) + '</td><td style="color:var(--text-mute);white-space:nowrap">' + fmtDate(sh.date) + '</td><td style="color:var(--text-mute)">' + esc(sh.scheduled || "—") + '</td><td style="color:' + (sh.actualArrival ? "var(--text)" : "var(--text-dim)") + '">' + esc(sh.actualArrival || "—") + '</td><td>' + shiftBadge(sh.status) + '</td><td style="color:var(--text-mute)">' + (sh.sessionHours || 0) + 'h</td><td style="color:var(--text-dim);max-width:160px;font-size:12px">' + esc(sh.notes || "—") + '</td><td><button class="btn btn-danger btn-sm" onclick="removeShift(\'' + esc(sh.id) + '\')">✕</button></td></tr>';
  }).join("") || '<tr><td colspan="8" class="tbl-empty">No shift records found.</td></tr>';
  return '<div class="section-header"><div class="section-title">Attendance</div><button class="btn btn-primary" onclick="openShiftModal()">+ Log Shift</button></div><div style="margin-bottom:16px"><select class="filter-select" onchange="attendanceFilter=this.value;renderTab()"><option value="All"' + (attendanceFilter === "All" ? " selected" : "") + '>All Staff</option>' + staffOpts + '</select></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Date</th><th>Scheduled</th><th>Arrived</th><th>Status</th><th>Hours</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function openShiftModal() {
  if (!DB.staff.length) { toast("Please add staff members first.", "error"); return; }
  var staffOpts = sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join("");
  var statusOpts = SHIFT_STATUSES.map(function(s) { return '<option>' + s + '</option>'; }).join("");
  var todayStr = new Date().toISOString().slice(0, 10);
  openModal("Log Shift",
    '<div class="field"><label>Staff Member</label><select id="sh-staff"><option value="">Select staff…</option>' + staffOpts + '</select></div>' +
    '<div class="field"><label>Date</label><input id="sh-date" type="date" value="' + todayStr + '"/></div>' +
    '<div class="field"><label>Scheduled Time</label><input id="sh-sched" type="time" value="09:30"/></div>' +
    '<div class="field"><label>Actual Arrival</label><input id="sh-arrival" type="time"/></div>' +
    '<div class="field"><label>Status</label><select id="sh-status" onchange="checkShiftAlert()">' + statusOpts + '</select></div>' +
    '<div class="field"><label>Session Hours</label><input id="sh-hours" type="number" step="0.5" value="3"/></div>' +
    '<div class="field"><label>Notes</label><textarea id="sh-notes" rows="2"></textarea></div>' +
    '<div id="sh-alert" style="display:none" class="alert alert-danger">⚠️ A disciplinary record will be auto-raised.</div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveShift()">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openShiftModal = openShiftModal;

function checkShiftAlert() {
  var v = document.getElementById("sh-status").value;
  document.getElementById("sh-alert").style.display = (v === "No Show" || v === "Late") ? "block" : "none";
}
window.checkShiftAlert = checkShiftAlert;

async function saveShift() {
  var staffId = document.getElementById("sh-staff").value;
  var date = document.getElementById("sh-date").value;
  if (!staffId || !date) { toast("Staff and date are required.", "error"); return; }
  var status = document.getElementById("sh-status").value;
  var shiftId = uid();
  var sh = {
    staffId: staffId, date: date,
    scheduled: document.getElementById("sh-sched").value,
    actualArrival: document.getElementById("sh-arrival").value,
    status: status,
    sessionHours: parseFloat(document.getElementById("sh-hours").value) || 0,
    notes: document.getElementById("sh-notes").value.trim()
  };
  var ok = await saveDoc("shifts", shiftId, sh);
  if (ok && (status === "No Show" || status === "Late")) {
    await saveDoc("disc", uid(), {
      staffId: staffId, date: date,
      type: status === "No Show" ? "Absence – No Show" : "Late Arrival",
      level: "Verbal Warning", status: "Open",
      notes: "Auto-raised from attendance log.",
      linkedShift: shiftId
    });
  }
  if (ok) { closeModal(); toast("Shift logged"); }
}
window.saveShift = saveShift;

async function removeShift(id) {
  if (!await appConfirm("Delete this shift record?", "Delete")) return;
  var ok = await deleteDocById("shifts", id);
  if (ok) toast("Shift deleted");
}
window.removeShift = removeShift;
</script>
<script>
// ━━━ DISCIPLINARY ━━━
function renderDisciplinary() {
  var filtered = DB.disc.slice().filter(function(d) { return discFilter === "All" || d.status === discFilter; }).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  var cards = filtered.map(function(d) {
    return '<div class="disc-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><div style="flex:1;min-width:200px"><div style="font-weight:700;font-size:15px;margin-bottom:8px">' + esc(staffName(d.staffId)) + '</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' + discBadge(d.level) + badge(d.type || "—", "#64748b") + badge(d.status, d.status === "Open" ? "#f97316" : "#22c55e") + '</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:' + (d.notes ? "8px" : "0") + '">' + fmtDate(d.date) + '</div>' + (d.notes ? '<div class="notes-block">' + esc(d.notes) + '</div>' : "") + '</div><div style="display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="toggleDisc(\'' + esc(d.id) + '\')">' + (d.status === "Open" ? "Resolve" : "Reopen") + '</button><button class="btn btn-danger btn-sm" onclick="removeDisc(\'' + esc(d.id) + '\')">Remove</button></div></div></div>';
  }).join("") || '<div class="tbl-empty">No disciplinary records.</div>';
  var pills = ["All", "Open", "Resolved"].map(function(s) {
    return '<button class="pill' + (discFilter === s ? " active" : "") + '" onclick="discFilter=\'' + s + '\';renderTab()">' + s + '</button>';
  }).join("");

}

function openDiscModal() {
  if (!DB.staff.length) { toast("Please add staff members first.", "error"); return; }
  var staffOpts = sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join("");
  var typeOpts = DISC_TYPES.map(function(t) { return '<option>' + t + '</option>'; }).join("");
  var levelOpts = DISC_LEVELS.map(function(l) { return '<option>' + l + '</option>'; }).join("");
  var todayStr = new Date().toISOString().slice(0, 10);
  openModal("Log Disciplinary",
    '<div class="field"><label>Staff Member</label><select id="dc-staff"><option value="">Select staff…</option>' + staffOpts + '</select></div>' +
    '<div class="field"><label>Date</label><input id="dc-date" type="date" value="' + todayStr + '"/></div>' +
    '<div class="field"><label>Type</label><select id="dc-type">' + typeOpts + '</select></div>' +
    '<div class="field"><label>Level</label><select id="dc-level">' + levelOpts + '</select></div>' +
    '<div class="field"><label>Status</label><select id="dc-status"><option>Open</option><option>Resolved</option></select></div>' +
    '<div class="field"><label>Notes</label><textarea id="dc-notes" rows="3"></textarea></div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveDisc()">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openDiscModal = openDiscModal;

async function saveDisc() {
  var staffId = document.getElementById("dc-staff").value;
  if (!staffId) { toast("Please select a staff member.", "error"); return; }
  var ok = await saveDoc("disc", uid(), {
    staffId: staffId,
    date: document.getElementById("dc-date").value,
    type: document.getElementById("dc-type").value,
    level: document.getElementById("dc-level").value,
    status: document.getElementById("dc-status").value,
    notes: document.getElementById("dc-notes").value.trim()
  });
  if (ok) { closeModal(); toast("Disciplinary saved"); }
}
window.saveDisc = saveDisc;

async function toggleDisc(id) {
  var d = DB.disc.find(function(x) { return x.id === id; });
  if (!d) return;
  var newStatus = d.status === "Open" ? "Resolved" : "Open";
  var updated = Object.assign({}, d, { status: newStatus });
  delete updated.id;
  var ok = await saveDoc("disc", id, updated);
  if (ok) toast(newStatus === "Resolved" ? "Marked as resolved" : "Reopened");
}
window.toggleDisc = toggleDisc;

async function removeDisc(id) {
  if (!await appConfirm("Delete this disciplinary record?", "Delete")) return;
  var ok = await deleteDocById("disc", id);
  if (ok) toast("Record deleted");
}
window.removeDisc = removeDisc;

// ━━━ PAY ━━━
function renderPay() {
  var rows = sortByName(DB.staff).map(function(s) {
    var myShifts = DB.shifts.filter(function(sh) { return sh.staffId === s.id && sh.date && sh.date.startsWith(payMonth); });
    var hours = myShifts.filter(function(sh) { return sh.status !== "No Show"; }).reduce(function(a, sh) { return a + (sh.sessionHours || 0); }, 0);
    var deductions = myShifts.filter(function(sh) { return sh.status === "No Show"; }).length * (s.hourlyRate || 0) * 3;
    var gross = hours * (s.hourlyRate || 0);
    return { s: s, sessions: myShifts.length, hours: hours, gross: gross, deductions: deductions, net: Math.max(0, gross - deductions) };
  });
  var total = rows.reduce(function(a, r) { return a + r.net; }, 0);
  var monthLabel = new Date(payMonth + "-01").toLocaleDateString("en-GB", { month: "long", year: "numeric" });
  var trows = rows.map(function(r) {
    return '<tr><td><div style="font-weight:700">' + esc(r.s.name) + '</div><div style="font-size:11px;color:var(--text-dim)">' + esc(r.s.role || "") + '</div></td><td style="color:var(--text-mute)">£' + (r.s.hourlyRate || 0) + '/hr</td><td style="color:var(--text-mute)">' + r.sessions + '</td><td style="color:var(--text-mute)">' + r.hours + 'h</td><td>£' + r.gross.toFixed(2) + '</td><td style="color:' + (r.deductions > 0 ? "var(--red)" : "var(--text-dim)") + '">' + (r.deductions > 0 ? "-£" + r.deductions.toFixed(2) : "—") + '</td><td style="font-weight:800;color:#4ade80">£' + r.net.toFixed(2) + '</td></tr>';
  }).join("") || '<tr><td colspan="7" class="tbl-empty">No staff yet.</td></tr>';
  return '<div class="section-header"><div class="section-title">Pay</div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input type="month" class="filter-select" value="' + payMonth + '" onchange="payMonth=this.value;renderTab()"/><button class="btn btn-warning btn-sm" onclick="exportPayCSV()">⬇ CSV</button></div></div><div style="background:#22c55e22;border:1px solid #22c55e55;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:26px;font-weight:800;color:#4ade80">£' + total.toFixed(2) + '</div><div style="color:var(--text-mute);font-size:13px">Total payroll for ' + monthLabel + '</div></div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Rate</th><th>Sessions</th><th>Hours</th><th>Gross</th><th>Deductions</th><th>Net</th></tr></thead><tbody>' + trows + '</tbody></table></div>';
}

// ━━━ QUALIFICATIONS ━━━
function renderQualifications() {
  var allQuals = DB.staff.flatMap(function(s) {
    return (s.qualifications || []).map(function(q) {
      return Object.assign({}, q, { staffId: s.id, staffName: s.name, qs: qualStatus(q.expiry) });
    });
  }).filter(function(q) { return qualFilter === "All" || q.qs === qualFilter; }).sort(function(a, b) { return new Date(a.expiry) - new Date(b.expiry); });
  var rows = allQuals.map(function(q) {
    var days = daysUntil(q.expiry);
    return '<tr><td style="font-weight:600;white-space:nowrap">' + esc(q.staffName) + '</td><td style="color:var(--text-mute)">' + esc(q.name) + '</td><td style="color:var(--text-mute);white-space:nowrap">' + fmtDate(q.expiry) + '</td><td>' + badge(QUAL_LABELS[q.qs], QUAL_COLORS[q.qs]) + '</td><td style="color:' + QUAL_COLORS[q.qs] + ';font-weight:700">' + (days < 0 ? Math.abs(days) + "d ago" : days + "d") + '</td><td><button class="btn btn-danger btn-sm" onclick="removeQual(\'' + esc(q.staffId) + '\',\'' + esc(q.name) + '\',\'' + esc(q.expiry) + '\')">✕</button></td></tr>';
  }).join("") || '<tr><td colspan="6" class="tbl-empty">No qualifications.</td></tr>';
  var filterPills = ["All", "ok", "warning", "expired"].map(function(f) {
    var label = f === "All" ? "All" : QUAL_LABELS[f];
    var color = f === "All" ? "#22c55e" : QUAL_COLORS[f];
    var isActive = qualFilter === f;
    return '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:" + color + "22;border-color:" + color + ";color:" + color : "") + '" onclick="qualFilter=\'' + f + '\';renderTab()">' + label + '</button>';
  }).join("");
  return '<div class="section-header"><div class="section-title">Qualifications</div><button class="btn btn-primary" onclick="openQualModal()">+ Add</button></div><div class="filter-pills">' + filterPills + '</div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Qualification</th><th>Expiry</th><th>Status</th><th>Days Left</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function openQualModal() {
  if (!DB.staff.length) { toast("Please add staff members first.", "error"); return; }
  var staffOpts = sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join("");
  openModal("Add Qualification",
    '<div class="field"><label>Staff Member</label><select id="ql-staff"><option value="">Select staff…</option>' + staffOpts + '</select></div>' +
    '<div class="field"><label>Qualification</label><input id="ql-name" placeholder="e.g. FA Level 2, DBS, First Aid"/></div>' +
    '<div class="field"><label>Expiry Date</label><input id="ql-expiry" type="date"/></div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveQual()">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openQualModal = openQualModal;

async function saveQual() {
  var staffId = document.getElementById("ql-staff").value;
  var name = document.getElementById("ql-name").value.trim();
  var expiry = document.getElementById("ql-expiry").value;
  if (!staffId || !name || !expiry) { toast("All fields are required.", "error"); return; }
  var staff = DB.staff.find(function(x) { return x.id === staffId; });
  if (!staff) { toast("Staff not found", "error"); return; }
  var updated = Object.assign({}, staff, {
    qualifications: (staff.qualifications || []).concat([{ name: name, expiry: expiry }])
  });
  delete updated.id;
  var ok = await saveDoc("staff", staffId, updated);
  if (ok) { closeModal(); toast("Qualification added"); }
}
window.saveQual = saveQual;

async function removeQual(staffId, qualName, qualExpiry) {
  if (!await appConfirm("Remove this qualification?", "Remove")) return;
  var staff = DB.staff.find(function(x) { return x.id === staffId; });
  if (!staff) return;
  var updated = Object.assign({}, staff, {
    qualifications: (staff.qualifications || []).filter(function(q) { return !(q.name === qualName && q.expiry === qualExpiry); })
  });
  delete updated.id;
  var ok = await saveDoc("staff", staffId, updated);
  if (ok) toast("Qualification removed");
}
window.removeQual = removeQual;

// ━━━ PERFORMANCE ━━━
function renderPerformance() {
  var filtered = DB.reviews.slice().filter(function(r) { return perfFilter === "All" || r.staffId === perfFilter; }).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  var staffOpts = sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '"' + (perfFilter === s.id ? " selected" : "") + '>' + esc(s.name) + '</option>'; }).join("");
  function rColor(n) { return n >= 4 ? "#22c55e" : n === 3 ? "#f59e0b" : "#ef4444"; }
  function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
  var cards = filtered.map(function(r) {
    return '<div class="review-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><div style="flex:1;min-width:200px"><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:6px"><div style="font-weight:700;font-size:15px">' + esc(staffName(r.staffId)) + '</div><div style="font-size:18px;color:' + rColor(r.rating) + ';letter-spacing:2px">' + stars(r.rating) + '</div></div><div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">' + fmtDate(r.date) + '</div>' + (r.goals ? '<div style="font-size:13px;color:var(--text-mute);margin-bottom:6px"><span style="color:var(--text-dim)">Goals: </span>' + esc(r.goals) + '</div>' : "") + (r.notes ? '<div class="notes-block">' + esc(r.notes) + '</div>' : "") + '</div><button class="btn btn-danger btn-sm" onclick="removeReview(\'' + esc(r.id) + '\')">Remove</button></div></div>';
  }).join("") || '<div class="tbl-empty">No reviews yet.</div>';
  return '<div class="section-header"><div class="section-title">Performance</div><button class="btn btn-primary" onclick="openReviewModal()">+ Log Review</button></div><div style="margin-bottom:16px"><select class="filter-select" onchange="perfFilter=this.value;renderTab()"><option value="All"' + (perfFilter === "All" ? " selected" : "") + '>All Staff</option>' + staffOpts + '</select></div>' + cards;
}

function openReviewModal() {
  if (!DB.staff.length) { toast("Please add staff members first.", "error"); return; }
  reviewRating = 3;
  var staffOpts = sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '">' + esc(s.name) + '</option>'; }).join("");
  var todayStr = new Date().toISOString().slice(0, 10);
  openModal("Log Performance Review",
    '<div class="field"><label>Staff Member</label><select id="rv-staff"><option value="">Select staff…</option>' + staffOpts + '</select></div>' +
    '<div class="field"><label>Date</label><input id="rv-date" type="date" value="' + todayStr + '"/></div>' +
    '<div class="field"><label>Rating</label><div style="display:flex;gap:8px" id="star-row">' + [1, 2, 3, 4, 5].map(function(n) { return '<button class="star-btn' + (n <= 3 ? " active" : "") + '" onclick="setRating(' + n + ')" type="button">★</button>'; }).join("") + '</div></div>' +
    '<div class="field"><label>Goals</label><textarea id="rv-goals" rows="2"></textarea></div>' +
    '<div class="field"><label>Notes</label><textarea id="rv-notes" rows="3"></textarea></div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveReview()">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');

window.openReviewModal = openReviewModal;

function setRating(n) {
  reviewRating = n;
  document.querySelectorAll(".star-btn").forEach(function(b, i) { b.classList.toggle("active", i < n); });
}
window.setRating = setRating;

async function saveReview() {
  var staffId = document.getElementById("rv-staff").value;
  if (!staffId) { toast("Please select a staff member.", "error"); return; }
  var ok = await saveDoc("reviews", uid(), {
    staffId: staffId,
    date: document.getElementById("rv-date").value,
    rating: reviewRating,
    goals: document.getElementById("rv-goals").value.trim(),
    notes: document.getElementById("rv-notes").value.trim()
  });
  if (ok) { closeModal(); toast("Review saved"); }
}
window.saveReview = saveReview;

async function removeReview(id) {
  if (!await appConfirm("Delete this review?", "Delete")) return;
  var ok = await deleteDocById("reviews", id);
  if (ok) toast("Review deleted");
}
window.removeReview = removeReview;
</script>
<script>
// ━━━ USER MANAGEMENT ━━━
function renderUsers() {
  if (currentUser.role !== "owner") return '<div class="alert alert-danger">Access restricted to the system owner.</div>';
  var users = DB.users || [];
  var rows = sortByName(users).map(function(u) {
    var isOwner = u.role === "owner";
    var isMe = u.id === currentUser.uid;
    return '<div class="user-row"><div style="min-width:0;flex:1"><div style="font-weight:700;font-size:15px">' + esc(u.name) + ' ' + (isOwner ? badge("Owner", "#ef4444") : badge("Admin", "#3b82f6")) + (isMe ? ' ' + badge("You", "#22c55e") : "") + '</div><div style="font-size:12px;color:var(--text-mute);margin-top:4px">' + esc(u.email) + '</div></div><div style="display:flex;gap:8px;flex-wrap:wrap">' + (isMe ? '<button class="btn btn-ghost btn-sm" onclick="openPasswordChangeModal()">Change Password</button>' : '') + (!isOwner && !isMe ? '<button class="btn btn-warning btn-sm" onclick="sendPasswordReset(\'' + esc(u.email) + '\')">Send Reset Email</button><button class="btn btn-danger btn-sm" onclick="removeUser(\'' + esc(u.id) + '\',\'' + esc(u.name) + '\')">Remove</button>' : '') + '</div></div>';
  }).join("");
  return '<div class="section-header"><div class="section-title">Admin Users</div><button class="btn btn-primary" onclick="openAddUserModal()">+ Add Admin</button></div><div class="alert alert-info"><strong>How this works:</strong> Add an admin by entering their email and a temporary password. Share these securely. They can change their password themselves via the "Reset it" link on the login screen. Click Remove to revoke access.</div>' + rows;
}

function openAddUserModal() {
  openModal("Add Admin User",
    '<div class="field"><label>Full Name</label><input id="u-name"/></div>' +
    '<div class="field"><label>Email</label><input id="u-email" type="email" placeholder="ediz@example.com"/></div>' +
    '<div class="field"><label>Temporary Password (min 6 chars)</label><input id="u-pass" type="text" placeholder="Tell them to change this immediately"/></div>' +
    '<div class="alert alert-warning">⚠️ Share these credentials with the admin securely (e.g. WhatsApp). They should change their password immediately on first sign-in.</div>' +
    '<div style="display:flex;gap:10px"><button id="u-save-btn" class="btn btn-primary" style="flex:1" onclick="saveNewUser()">Create</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openAddUserModal = openAddUserModal;

async function saveNewUser() {
  if (LOCAL_MODE) {
    toast("Firebase required for multi-user access. See setup guide.", "error");
    return;
  }
  var name = document.getElementById("u-name").value.trim();
  var email = document.getElementById("u-email").value.trim().toLowerCase();
  var pass = document.getElementById("u-pass").value;
  var btn = document.getElementById("u-save-btn");
  if (!name || !email || pass.length < 6) { toast("Name, email, and password (min 6 chars) required.", "error"); return; }
  if (!email.includes("@")) { toast("Please enter a valid email.", "error"); return; }
  btn.disabled = true;
  btn.textContent = "Creating…";
  try {
    // Use a secondary Firebase app so we don't get logged out
    var secApp = window.fbInit(window.firebaseConfig, "Secondary" + Date.now());
    var secAuth = window.fbGetAuth(secApp);
    var cred = await window.fbCreateUser(secAuth, email, pass);
    await saveDoc("users", cred.user.uid, {
      name: name, email: email, role: "admin",
      createdAt: new Date().toISOString()
    });
    await window.fb.signOut(secAuth);
    closeModal();
    toast("Admin created! Share credentials securely.", "success"); closeModal();
    toast("Admin added");
  } catch (e) {
    var msg = "Could not create user.";
    if (e.code === "auth/email-already-in-use") msg = "That email is already registered.";
    if (e.code === "auth/invalid-email") msg = "Invalid email address.";
    if (e.code === "auth/weak-password") msg = "Password too weak (min 6 chars).";
    toast(msg, "error");
    btn.disabled = false;
    btn.textContent = "Create";
  }
}
window.saveNewUser = saveNewUser;

async function sendPasswordReset(email) {
  if (LOCAL_MODE) { toast("Requires Firebase (cloud mode).", "error"); return; }
  if (!await appConfirm("Send a password reset email to " + email + "?", "Send")) return;
  try {
    await window.fb.sendPasswordResetEmail(window.fbAuth, email);
    toast("Reset email sent");
  } catch (e) {
    toast("Could not send reset email", "error");
  }
}
window.sendPasswordReset = sendPasswordReset;

async function removeUser(id, name) {
  if (!await appConfirm("Remove " + name + "? This revokes their access immediately.", "Remove")) return;
  var ok = await deleteDocById("users", id);
  if (ok) toast("Admin removed");
}
window.removeUser = removeUser;

function openPasswordChangeModal() {
  openModal("Change Password",
    '<div class="field"><label>Current Password</label><input id="pc-current" type="password"/></div>' +
    '<div class="field"><label>New Password (min 6 chars)</label><input id="pc-new" type="password"/></div>' +
    '<div class="field"><label>Confirm New Password</label><input id="pc-conf" type="password"/></div>' +
    '<div style="display:flex;gap:10px"><button id="pc-save-btn" class="btn btn-primary" style="flex:1" onclick="savePwdChange()">Update Password</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openPasswordChangeModal = openPasswordChangeModal;

async function savePwdChange() {
  if (LOCAL_MODE) {
    toast("Firebase required for password management.", "error");
    return;
  }
  var cur = document.getElementById("pc-current").value;
  var nw = document.getElementById("pc-new").value;
  var cf = document.getElementById("pc-conf").value;
  var btn = document.getElementById("pc-save-btn");
  if (nw.length < 6) { toast("New password must be at least 6 characters.", "error"); return; }
  if (nw !== cf) { toast("New passwords do not match.", "error"); return; }
  btn.disabled = true;
  btn.textContent = "Updating…";
  try {
    var user = window.fbAuth.currentUser;
    var credential = window.fb.EmailAuthProvider.credential(user.email, cur);
    await window.fb.reauthenticateWithCredential(user, credential);
    await window.fb.updatePassword(user, nw);
    closeModal();
    toast("Password updated");
  } catch (e) {
    var msg = "Could not update password.";
    if (e.code === "auth/wrong-password" || e.code === "auth/invalid-credential") msg = "Current password is incorrect.";
    toast(msg, "error");
    btn.disabled = false;
    btn.textContent = "Update Password";
  }
}
window.savePwdChange = savePwdChange;

// ━━━ EXPORT ━━━
function exportBackup() {
  var data = { exportedAt: new Date().toISOString(), version: "4.0", staff: DB.staff, shifts: DB.shifts, disc: DB.disc, reviews: DB.reviews, incidents: DB.incidents, kit: DB.kit, sponsors: DB.sponsors, grants: DB.grants };
  if (currentUser.role === "owner") data.users = DB.users;
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = "allsides-backup-" + new Date().toISOString().slice(0, 10) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  toast("Backup downloaded");
}
window.exportBackup = exportBackup;

function exportPayCSV() {
  var rows = [["Name", "Role", "Region", "Rate", "Sessions", "Hours", "Gross", "Deductions", "Net"]];
  DB.staff.forEach(function(s) {
    var myShifts = DB.shifts.filter(function(sh) { return sh.staffId === s.id && sh.date && sh.date.startsWith(payMonth); });
    var hours = myShifts.filter(function(sh) { return sh.status !== "No Show"; }).reduce(function(a, sh) { return a + (sh.sessionHours || 0); }, 0);
    var deductions = myShifts.filter(function(sh) { return sh.status === "No Show"; }).length * (s.hourlyRate || 0) * 3;
    var gross = hours * (s.hourlyRate || 0);
    rows.push([s.name, s.role, s.region, s.hourlyRate, myShifts.length, hours, gross.toFixed(2), deductions.toFixed(2), Math.max(0, gross - deductions).toFixed(2)]);
  });
  dlCSV(rows, "allsides-pay-" + payMonth + ".csv");
  toast("Pay CSV downloaded");
}
window.exportPayCSV = exportPayCSV;

function exportAttendanceCSV() {
  var rows = [["Staff", "Role", "Region", "Date", "Scheduled", "Arrived", "Status", "Hours", "Notes"]];
  DB.shifts.slice().sort(function(a, b) { return new Date(b.date) - new Date(a.date); }).forEach(function(sh) {
    var s = DB.staff.find(function(x) { return x.id === sh.staffId; });
    rows.push([s ? s.name : "", s ? s.role : "", s ? s.region : "", sh.date, sh.scheduled || "", sh.actualArrival || "", sh.status, sh.sessionHours || 0, sh.notes || ""]);
  });
  dlCSV(rows, "allsides-attendance-" + new Date().toISOString().slice(0, 10) + ".csv");
  toast("Attendance CSV downloaded");
}
window.exportAttendanceCSV = exportAttendanceCSV;

function dlCSV(rows, filename) {
  var csv = rows.map(function(r) { return r.map(function(c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\n");
  var blob = new Blob([csv], { type: "text/csv" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

<script>
// ━━━━━━━━━━━━━━━━━━━━━━ INCIDENT LOG ━━━━━━━━━━━━━━━━━━━━━━
var incidentFilter = "All";
var incidentSeverityFilter = "All";
var INCIDENT_SEVERITIES = ["Minor", "Moderate", "Serious", "Safeguarding"];
var INCIDENT_TYPES = ["Injury", "Near Miss", "Behavioural", "Property Damage", "Medical Emergency", "Safeguarding Concern", "Other"];
var INCIDENT_SEV_COLORS = { "Minor": "#3b82f6", "Moderate": "#f59e0b", "Serious": "#ef4444", "Safeguarding": "#7c3aed" };
var LOCATIONS = ["West Ham Park", "Canning Town Recreation Ground", "Leyton Jubilee Park", "Other"];

function renderIncidents() {
  var filtered = DB.incidents.slice().filter(function(i) {
    var sevOk = incidentSeverityFilter === "All" || i.severity === incidentSeverityFilter;
    return sevOk;
  }).sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  var cards = filtered.map(function(i) {
    return '<div class="disc-card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px"><div style="flex:1;min-width:200px"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">' + badge(i.severity, INCIDENT_SEV_COLORS[i.severity] || "#888") + badge(i.type || "—", "#64748b") + (i.location ? badge(i.location, "#3b82f6") : "") + '</div><div style="font-weight:700;font-size:15px;margin-bottom:4px">' + esc(i.title || "Untitled incident") + '</div><div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">' + fmtDate(i.date) + (i.staffInvolved ? ' · Involving: ' + esc(staffName(i.staffInvolved)) : '') + (i.reportedTo ? ' · Reported to: ' + esc(i.reportedTo) : '') + '</div>' + (i.description ? '<div class="notes-block"><strong>Description:</strong> ' + esc(i.description) + '</div>' : "") + (i.actionTaken ? '<div class="notes-block"><strong>Action taken:</strong> ' + esc(i.actionTaken) + '</div>' : "") + '</div><div style="display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap"><button class="btn btn-ghost btn-sm" onclick="openIncidentModal(\'' + esc(i.id) + '\')">Edit</button><button class="btn btn-danger btn-sm" onclick="removeIncident(\'' + esc(i.id) + '\')">Remove</button></div></div></div>';
  }).join("") || '<div class="tbl-empty">No incidents logged.</div>';
  var pills = ["All"].concat(INCIDENT_SEVERITIES).map(function(s) {
    var color = s === "All" ? "#22c55e" : INCIDENT_SEV_COLORS[s];
    var isActive = incidentSeverityFilter === s;
    return '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:" + color + "22;border-color:" + color + ";color:" + color : "") + '" onclick="incidentSeverityFilter=\'' + s + '\';renderTab()">' + s + '</button>';
  }).join("");
  return '<div class="section-header"><div class="section-title">Incident Log</div><button class="btn btn-primary" onclick="openIncidentModal(null)">+ Log Incident</button></div><div class="alert alert-info"><strong>Important:</strong> Log all injuries, near-misses, behavioural issues, and safeguarding concerns here. This creates a dated record for insurance and safeguarding purposes. <strong>Safeguarding</strong> concerns should also be reported to your Designated Safeguarding Lead immediately — this log does not replace that.</div><div class="filter-pills">' + pills + '</div>' + cards;
}

function openIncidentModal(id) {
  var i = id ? DB.incidents.find(function(x) { return x.id === id; }) : { severity: "Minor", type: "Injury", date: new Date().toISOString().slice(0,10) };
  if (id && !i) { toast("Incident not found", "error"); return; }
  var sevOpts = INCIDENT_SEVERITIES.map(function(s) { return '<option' + (i.severity === s ? " selected" : "") + '>' + s + '</option>'; }).join("");
  var typeOpts = INCIDENT_TYPES.map(function(t) { return '<option' + (i.type === t ? " selected" : "") + '>' + t + '</option>'; }).join("");
  var locOpts = LOCATIONS.map(function(l) { return '<option' + (i.location === l ? " selected" : "") + '>' + l + '</option>'; }).join("");
  var staffOpts = '<option value="">— None / Multiple —</option>' + sortByName(DB.staff).map(function(s) { return '<option value="' + s.id + '"' + (i.staffInvolved === s.id ? " selected" : "") + '>' + esc(s.name) + '</option>'; }).join("");
  openModal(id ? "Edit Incident" : "Log Incident",
    '<div class="field"><label>Title / Brief Summary</label><input id="in-title" value="' + esc(i.title || "") + '" placeholder="e.g. Twisted ankle during warm-up"/></div>' +
    '<div class="field"><label>Date</label><input id="in-date" type="date" value="' + esc(i.date || "") + '"/></div>' +
    '<div class="field"><label>Severity</label><select id="in-severity">' + sevOpts + '</select></div>' +
    '<div class="field"><label>Type</label><select id="in-type">' + typeOpts + '</select></div>' +
    '<div class="field"><label>Location</label><select id="in-location"><option value="">—</option>' + locOpts + '</select></div>' +
    '<div class="field"><label>Staff Involved (optional)</label><select id="in-staff">' + staffOpts + '</select></div>' +
    '<div class="field"><label>Description (what happened)</label><textarea id="in-description" rows="3">' + esc(i.description || "") + '</textarea></div>' +
    '<div class="field"><label>Action Taken</label><textarea id="in-action" rows="3">' + esc(i.actionTaken || "") + '</textarea></div>' +
    '<div class="field"><label>Reported To (name)</label><input id="in-reported" value="' + esc(i.reportedTo || "") + '" placeholder="e.g. DSL, parent, A&E"/></div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveIncident(\'' + (id || "") + '\')">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openIncidentModal = openIncidentModal;

async function saveIncident(id) {
  var title = document.getElementById("in-title").value.trim();
  if (!title) { toast("Please enter a brief title for the incident.", "error"); return; }
  var recordId = id || uid();
  var obj = {
    title: title,
    date: document.getElementById("in-date").value,
    severity: document.getElementById("in-severity").value,
    type: document.getElementById("in-type").value,
    location: document.getElementById("in-location").value,
    staffInvolved: document.getElementById("in-staff").value,
    description: document.getElementById("in-description").value.trim(),
    actionTaken: document.getElementById("in-action").value.trim(),
    reportedTo: document.getElementById("in-reported").value.trim(),
    loggedBy: currentUser.name,
    loggedAt: new Date().toISOString()
  };
  var ok = await saveDoc("incidents", recordId, obj);
  if (ok) { closeModal(); toast(id ? "Incident updated" : "Incident logged"); }
}
window.saveIncident = saveIncident;

async function removeIncident(id) {
  if (!await appConfirm("Delete this incident? Only do this if logged in error — incident records should generally be kept.", "Delete")) return;
  var ok = await deleteDocById("incidents", id);
  if (ok) toast("Incident deleted");
}
window.removeIncident = removeIncident;

// ━━━━━━━━━━━━━━━━━━━━━━ DBS TRACKER ━━━━━━━━━━━━━━━━━━━━━━
var dbsFilter = "All";

function dbsStatusFor(expiry) {
  if (!expiry) return "missing";
  var d = daysUntil(expiry);
  if (d < 0) return "expired";
  if (d <= 30) return "critical";
  if (d <= 90) return "warning";
  return "ok";
}
var DBS_COLORS = { missing: "#7c3aed", expired: "#ef4444", critical: "#ef4444", warning: "#f59e0b", ok: "#22c55e" };
var DBS_LABELS = { missing: "Not Recorded", expired: "Expired", critical: "Expires in 30d", warning: "Expires in 90d", ok: "Valid" };

function renderDBS() {
  var allDBS = DB.staff.map(function(s) {
    return { staffId: s.id, staffName: s.name, role: s.role, region: s.region, status: s.status, certNumber: s.dbsNumber || "", issueDate: s.dbsIssued || "", expiry: s.dbsExpiry || "", st: dbsStatusFor(s.dbsExpiry) };
  }).filter(function(d) { return dbsFilter === "All" || d.st === dbsFilter; }).sort(function(a, b) {
    var order = { critical: 0, expired: 1, missing: 2, warning: 3, ok: 4 };
    return order[a.st] - order[b.st];
  });
  var rows = allDBS.map(function(d) {
    var days = d.expiry ? daysUntil(d.expiry) : null;
    var daysCell = d.st === "missing" ? "—" : (days < 0 ? Math.abs(days) + "d ago" : days + "d");
    return '<tr><td style="font-weight:600;white-space:nowrap">' + esc(d.staffName) + '</td><td style="color:var(--text-mute)">' + esc(d.role || "") + '</td><td style="color:var(--text-mute)">' + esc(d.certNumber || "—") + '</td><td style="color:var(--text-mute);white-space:nowrap">' + fmtDate(d.issueDate) + '</td><td style="color:var(--text-mute);white-space:nowrap">' + fmtDate(d.expiry) + '</td><td>' + badge(DBS_LABELS[d.st], DBS_COLORS[d.st]) + '</td><td style="color:' + DBS_COLORS[d.st] + ';font-weight:700">' + daysCell + '</td><td><button class="btn btn-ghost btn-sm" onclick="openDBSModal(\'' + esc(d.staffId) + '\')">Update</button></td></tr>';
  }).join("") || '<tr><td colspan="8" class="tbl-empty">No staff records.</td></tr>';
  var counts = { critical: 0, expired: 0, missing: 0, warning: 0, ok: 0 };
  DB.staff.forEach(function(s) { counts[dbsStatusFor(s.dbsExpiry)]++; });
  var pills = [["All", "All"], ["critical", "Critical"], ["expired", "Expired"], ["missing", "Not Recorded"], ["warning", "Expiring"], ["ok", "Valid"]].map(function(p) {
    var f = p[0], label = p[1];
    var color = f === "All" ? "#22c55e" : DBS_COLORS[f];
    var isActive = dbsFilter === f;
    var count = f === "All" ? DB.staff.length : counts[f];
    return '<button class="pill' + (isActive ? " active" : "") + '" style="' + (isActive ? "background:" + color + "22;border-color:" + color + ";color:" + color : "") + '" onclick="dbsFilter=\'' + f + '\';renderTab()">' + label + ' (' + count + ')</button>';
  }).join("");
  var urgent = counts.critical + counts.expired + counts.missing;
  var urgentBanner = urgent > 0 ? '<div class="alert alert-danger"><strong>⚠️ ' + urgent + ' staff need urgent DBS attention:</strong> ' + (counts.expired ? counts.expired + ' expired · ' : '') + (counts.critical ? counts.critical + ' expire within 30 days · ' : '') + (counts.missing ? counts.missing + ' have no DBS recorded' : '') + '</div>' : '';
  return '<div class="section-header"><div class="section-title">DBS Tracker</div></div><div class="alert alert-info"><strong>Why this matters:</strong> Every member of staff who works with children must have a valid Enhanced DBS Check. Expired or missing DBS = serious safeguarding and legal risk. This module flags issues 90 days before expiry, escalates at 30 days, and tracks anyone with no DBS recorded. Update each staff member\'s DBS info using the buttons below.</div>' + urgentBanner + '<div class="filter-pills">' + pills + '</div><div class="tbl-wrap"><table><thead><tr><th>Staff</th><th>Role</th><th>DBS Number</th><th>Issued</th><th>Expires</th><th>Status</th><th>Days</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function openDBSModal(staffId) {
  var s = DB.staff.find(function(x) { return x.id === staffId; });
  if (!s) { toast("Staff not found", "error"); return; }
  openModal("DBS Details — " + s.name,
    '<div class="field"><label>DBS Certificate Number</label><input id="dbs-number" value="' + esc(s.dbsNumber || "") + '" placeholder="e.g. 001234567890"/></div>' +
    '<div class="field"><label>Issue Date</label><input id="dbs-issued" type="date" value="' + esc(s.dbsIssued || "") + '"/></div>' +
    '<div class="field"><label>Expiry Date</label><input id="dbs-expiry" type="date" value="' + esc(s.dbsExpiry || "") + '"/></div>' +
    '<div class="alert alert-info">Most DBS checks don\'t formally expire, but it\'s best practice to renew every 3 years. Set an expiry date 3 years from the issue date to get reminders.</div>' +
    '<div style="display:flex;gap:10px"><button class="btn btn-primary" style="flex:1" onclick="saveDBS(\'' + esc(staffId) + '\')">Save</button><button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button></div>');
}
window.openDBSModal = openDBSModal;

async function saveDBS(staffId) {
  var s = DB.staff.find(function(x) { return x.id === staffId; });
  if (!s) return;
  var updated = Object.assign({}, s, {
    dbsNumber: document.getElementById("dbs-number").value.trim(),
    dbsIssued: document.getElementById("dbs-issued").value,
    dbsExpiry: document.getElementById("dbs-expiry").value
  });
  delete updated.id;
  var ok = await saveDoc("staff", staffId, updated);
  if (ok) { closeModal(); toast("DBS updated"); }
}
window.saveDBS = saveDBS;

// ━━━━━━━━━━━━━━━━━━━━━━ KIT & EQUIPMENT ━━━━━━━━━━━━━━━━━━━━━━
var kitLocationFilter = "All";
var kitConditionFilter = "All";
var KIT_CONDITIONS = ["Good", "Fair", "Needs Replacing", "Lost"];
var KIT_COND_COLORS = { "Good": "#22c55e", "Fair": "#f59e0b", "Needs Replacing": "#ef4444", "Lost": "#7c3aed" };
var KIT_CATEGORIES = ["Footballs", "Cones", "Bibs", "Goals", "First Aid", "Training Kit", "Match Kit", "Storage", "Other"];

function renderKit() {
  var filtered = DB.kit.slice().filter(function(k) {
    var locOk = kitLocationFilter === "All" || k.location === kitLocationFilter;
    var condOk = kitConditionFilter === "All" || k.condition === kitConditionFilter;
    return locOk && condOk;
  }).sort(function(a, b) {
    if (a.location !== b.location) return (a.location || "").localeCompare(b.location || "");
    return (a.itemName || "").localeCompare(b.itemName || "");
  });
  var rows = filtered.map(function(k) {
    return '<tr><td style="font-weight:600">' + esc(k.itemName) + '</td><td style="color:var(--text-mute)">' + esc(k.category || "—") + '</td><td style="color:var(--text-mute)">' + (k.quantity || 0) + '</td><td>' + badge(k.location || "—", "#3b82f6") + '</td><td>' + badge(k.condition || "Good", KIT_COND_COLORS[k.condition] || "#888") + '</td><td style="color:var(--text-mute);white-space:nowrap">' + fmtDate(k.lastChecked) + '</td><td style="color:var(--text-dim);max-width:160px;font-size:12px">' + esc(k.notes || "—") + '</td><td><button class="btn btn-ghost btn-sm" onclick="openKitModal(\'' + esc(k.id) + '\')">Edit</button> <button class="btn btn-danger btn-sm" onclick="removeKit(\'' + esc(k.id) + '\')">✕</button></td></tr>';
  }).join("") || '<tr><td colspan="8" class="tbl-empty">No kit logged yet.</td></tr>';
  var locOpts = LOCATIONS.map(function(l) { return '<option value="' + l + '"' + (kitLocationFilter === l ? " selected" : "") + '>' + l + '</option>'; }).join("");
  var condOpts = KIT_CONDITIONS.map(function(c) { return '<option value="' + c + '"' + (kitConditionFilter === c ? " selected" : "") + '>' + c + '</option>'; }).join("");
  var needsReplacing = DB.kit.filter(function(k) { return k.condition === "Needs Replacing" || k.condition === "Lost"; }).length;
  var banner = needsReplacing > 0 ? '<div class="alert alert-warning"><strong>' + needsReplacing + ' item' + (needsReplacing > 1 ? 's' : '') + '</strong> need replacing or are marked lost. Filter by condition to see them.</div>' : '';
  return '<div class="section-header"><div class="section-title">Kit & Equipment</div><button class="btn btn-primary" onclick="openKitModal(null)">+ Add Item</button></div>' + banner + '<div class="search-row"><select class="filter-select" onchange="kitLocationFilter=this.value;renderTab()"><option value="All"' + (kitLocationFilter === "All" ? " selected" : "") + '>All Locations</option>' + locOpts + '</select><select class="filter-select" onchange="kitConditionFilter=this.value;renderTab()"><option value="All"' + (kitConditionFilter === "All" ? " selected" : "") + '>All Conditions</option>' + condOpts + '</select></div><div class="tbl-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Qty</th><th>Location</th><th>Condition</th><th>Last Checked</th><th>Notes</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}

function openKitModal(id) {
  var k = id ? DB.kit.find(function(x) { return x.id === id; }) : { condition: "Good", location: "West Ham Park", category: "Footballs", quantity: 1, lastChecked: new Date().toISOString().slice(0,10) };
  if (id && !k) { toast("Kit item not found", "error"); return; }

function sponsorStatus(endDate) {
  if (!endDate) return "ok";
  var d = daysUntil(endDate);
  if (d < 0) return "expired";
  if (d <= 90) return "renewal";
  return "active";
}
var SPONSOR_COLORS = { active: "#22c55e", renewal: "#f59e0b", expired: "#ef4444" };
var SPONSOR_LABELS = { active: "Active", renewal: "Renewal Due", expired: "Expired" };

function renderSponsors() {
  var sponsors = DB.sponsors.slice().sort(function(a, b) {
    var aSt = sponsorStatus(a.endDate), bSt = sponsorStatus(b.endDate);
    var order = { renewal: 0, expired: 1, active: 2 };
    if (order[aSt] !== order[bSt]) return order[aSt] - order[bSt];
    return new Date(a.endDate || "9999-12-31") - new Date(b.endDate || "9999-12-31");
  });
  var totalActive = sponsors.filter(function(s) { return sponsorStatus(s.endDate) === "active" || sponsorStatus(s.endDate) === "renewal"; }).reduce(function(sum, s) { return sum + (parseFloat(s.value) || 0); }, 0);
  var renewals = sponsors.filter(function(s) { return sponsorStatus(s.endDate) === "renewal"; }).length;
  var cards = sponsors.map(function(s) {
    var st = sponsorStatus(s.endDate);
    var daysLeft = s.endDate ? daysUntil(s.endDate) : null;
    return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:12px"><div style="min-width:0;flex:1"><div style="font-weight:800;font-size:16px;margin-bottom:4px">' + esc(s.name) + '</div><div style="font-size:12px;color:var(--text-mute)">' + esc(s.contactName || "") + (s.contactEmail ? ' · ' + esc(s.contactEmail) : '') + '</div></div>' + badge(SPONSOR_LABELS[st], SPONSOR_COLORS[st]) + '</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;font-size:13px"><div><div style="color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Value</div><div style="font-weight:800;color:#4ade80">£' + (parseFloat(s.value) || 0).toFixed(2) + '</div></div><div><div style="color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">Term</div><div style="font-weight:600">' + fmtDate(s.startDate) + ' → ' + fmtDate(s.endDate) + '</div></div>' + (daysLeft !== null ? '<div><div style="color:var(--text-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px">' + (daysLeft < 0 ? 'Ended' : 'Days Left') + '</div><div style="font-weight:700;color:' + SPONSOR_COLORS[st] + '">' + (daysLeft < 0 ? Math.abs(daysLeft) + 'd ago' : daysLeft + 'd') + '</div></div>' : '') + '</div>' + (s.placement ? '<div style="font-size:12px;color:var(--text-mute);margin-bottom:8px"><strong>Placement:</strong> ' + esc(s.placement) + '</div>' : '') + (s.deliverables ? '<div class="notes-block" style="margin-bottom:8px"><strong>Deliverables:</strong> ' + esc(s.deliverables) + '</div>' : '') + (s.notes ? '<div class="notes-block">' + esc(s.notes) + '</div>' : '') + '<div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-ghost btn-sm" style="flex:1" onclick="openSponsorModal(\'' + esc(s.id) + '\')">Edit</button><button class="btn btn-danger btn-sm" style="flex:1" onclick="removeSponsor(\'' + esc(s.id) + '\')">Remove</button></div></div>';
  }).join("") || '<div style="grid-column:1/-1" class="tbl-empty">No sponsors yet. Diamond Essence should be your first record.</div>';
  var renewalBanner = renewals > 0 ? '<div class="alert alert-warning"><strong>' + renewals + ' sponsor' + (renewals > 1 ? 's' : '') + '</strong> due for renewal within 90 days. Reach out to them now to discuss extending.</div>' : '';
  return '<div class="section-header"><div class="section-title">Sponsors</div><button class="btn btn-primary" onclick="openSponsorModal(null)">+ Add Sponsor</button></div>' + renewalBanner + '<div style="background:#22c55e22;border:1px solid #22c55e55;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="font-size:26px;font-weight:800;color:#4ade80">£' + totalActive.toFixed(2) + '</div><div style="color:var(--text-mute);font-size:13px">Total sponsorship value (active + due for renewal)</div></div><div class="staff-grid">' + cards + '</div>';
