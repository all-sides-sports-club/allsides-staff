// ━━━━━━━━━━━━━━━━━━━━━━ WEEKLY SUMMARY ━━━━━━━━━━━━━━━━━━━━━━
function getLastSundayRange() {
  var now = new Date();
  var dow = now.getDay(); // 0 = Sunday
  // Find the most recent Sunday
  var lastSunday = new Date(now);
  lastSunday.setDate(now.getDate() - dow);
  lastSunday.setHours(0, 0, 0, 0);
  // For the week starting that Sunday, end is the next Sunday morning
  var weekEnd = new Date(lastSunday);
  weekEnd.setDate(lastSunday.getDate() + 7);
  return { start: lastSunday, end: weekEnd };
}

function generateSummary() {
  var range = getLastSundayRange();
  var startISO = range.start.toISOString().slice(0, 10);
  var endISO = range.end.toISOString().slice(0, 10);
  var weekLabel = range.start.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });

  var weekShifts = DB.shifts.filter(function(sh) { return sh.date >= startISO && sh.date < endISO; });
  var weekIncidents = DB.incidents.filter(function(i) { return i.date >= startISO && i.date < endISO; });
  var weekDisc = DB.disc.filter(function(d) { return d.date >= startISO && d.date < endISO; });
  var weekReviews = DB.reviews.filter(function(r) { return r.date >= startISO && r.date < endISO; });

  var totalHours = weekShifts.filter(function(s) { return s.status !== "No Show"; }).reduce(function(a, s) { return a + (s.sessionHours || 0); }, 0);
  var presents = weekShifts.filter(function(s) { return s.status === "Present"; }).length;
  var lates = weekShifts.filter(function(s) { return s.status === "Late"; }).length;
  var noShows = weekShifts.filter(function(s) { return s.status === "No Show"; }).length;
  var notified = weekShifts.filter(function(s) { return s.status === "Absent – Notified"; }).length;

  // Upcoming concerns (next 30 days)
  var upcomingDBS = DB.staff.filter(function(s) {
    var st = dbsStatusFor(s.dbsExpiry);
    return st === "critical" || st === "expired";
  });
  var upcomingQuals = DB.staff.flatMap(function(s) {
    return (s.qualifications || []).filter(function(q) {
      var d = daysUntil(q.expiry);
      return d >= 0 && d <= 30;
    }).map(function(q) { return { staff: s.name, qual: q.name, expiry: q.expiry }; });
  });
  var upcomingDeadlines = DB.grants.filter(function(g) {
    if (!g.deadline) return false;
    var d = daysUntil(g.deadline);
    return d >= 0 && d <= 14 && g.status !== "Completed" && g.status !== "Rejected";
  });
  var sponsorRenewals = DB.sponsors.filter(function(s) { return sponsorStatus(s.endDate) === "renewal"; });

  // Build the summary text
  var lines = [];
  lines.push("📋 ALL-SIDES SPORTS CLUB — WEEKLY SUMMARY");
  lines.push("Week of " + weekLabel);
  lines.push("");
  lines.push("━━━━━━━━━━━━━━━━━━━━");
  lines.push("👥 STAFF & SESSIONS");
  lines.push("━━━━━━━━━━━━━━━━━━━━");
  lines.push("Sessions logged: " + weekShifts.length);
  lines.push("Total coaching hours: " + totalHours);
  lines.push("✅ Present: " + presents);
  if (lates > 0) lines.push("⏰ Late: " + lates);
  if (notified > 0) lines.push("📞 Absent (notified): " + notified);
  if (noShows > 0) lines.push("❌ No-shows: " + noShows);
  lines.push("");

  if (weekIncidents.length > 0) {
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    lines.push("⚠️ INCIDENTS THIS WEEK");
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    weekIncidents.forEach(function(i) {
      lines.push("• [" + i.severity + "] " + i.title + (i.location ? " — " + i.location : ""));
    });
    lines.push("");
  }

  if (weekDisc.length > 0) {
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    lines.push("🟠 DISCIPLINARY ACTIONS");
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    weekDisc.forEach(function(d) {
      lines.push("• " + staffName(d.staffId) + " — " + d.level + " (" + d.type + ")");
    });
    lines.push("");
  }

  if (weekReviews.length > 0) {
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    lines.push("⭐ REVIEWS COMPLETED");
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    weekReviews.forEach(function(r) {
      lines.push("• " + staffName(r.staffId) + " — " + r.rating + "/5");
    });
    lines.push("");
  }

  var hasUpcoming = upcomingDBS.length > 0 || upcomingQuals.length > 0 || upcomingDeadlines.length > 0 || sponsorRenewals.length > 0;
  if (hasUpcoming) {
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    lines.push("🔔 NEEDS ATTENTION");
    lines.push("━━━━━━━━━━━━━━━━━━━━");
    if (upcomingDBS.length > 0) {
      lines.push("DBS urgent action:");
      upcomingDBS.forEach(function(s) {
        var st = dbsStatusFor(s.dbsExpiry);
        lines.push("  • " + s.name + " — " + DBS_LABELS[st] + (s.dbsExpiry ? " (" + fmtDate(s.dbsExpiry) + ")" : ""));
      });
    }
    if (upcomingQuals.length > 0) {
      lines.push("Qualifications expiring in 30 days:");
      upcomingQuals.forEach(function(q) {
        lines.push("  • " + q.staff + " — " + q.qual + " (" + fmtDate(q.expiry) + ")");
      });
    }
    if (upcomingDeadlines.length > 0) {
      lines.push("Grant deadlines in next 14 days:");
      upcomingDeadlines.forEach(function(g) {
        lines.push("  • " + g.name + " (" + g.status + ") — " + fmtDate(g.deadline));
      });
    }
    if (sponsorRenewals.length > 0) {
      lines.push("Sponsor renewals due in 90 days:");
      sponsorRenewals.forEach(function(s) {
        lines.push("  • " + s.name + " — ends " + fmtDate(s.endDate));
      });
    }
    lines.push("");
  }

  lines.push("Generated " + new Date().toLocaleString("en-GB"));
  return lines.join("\n");
}

function renderSummary() {
  var text = generateSummary();
  return '<div class="section-header"><div class="section-title">Weekly Summary</div><button class="btn btn-primary" onclick="copySummary()">📋 Copy to Clipboard</button></div><div class="alert alert-info"><strong>Use this every Monday:</strong> Click "Copy to Clipboard", then paste into WhatsApp or email to update the team. The summary covers the most recent Sunday-to-Sunday week and flags anything needing attention in the next 14-30 days.</div><div style="background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:20px;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:13px;line-height:1.6;color:var(--text-mute);overflow-x:auto" id="summary-text">' + esc(text) + '</div>';
}

async function copySummary() {
  var text = generateSummary();
  try {
    await navigator.clipboard.writeText(text);
    toast("Summary copied to clipboard");
  } catch (e) {
    // Fallback for browsers without clipboard API
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); toast("Summary copied"); }
    catch (e2) { toast("Couldn't copy — please select and copy manually", "error"); }
    document.body.removeChild(ta);
  }
}
window.copySummary = copySummary;
</script>

</body>
